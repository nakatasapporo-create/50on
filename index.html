<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>おしゃべり５０音ボード</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel (JSXをブラウザで解釈するため) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons (CDN版) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* カスタムスクロールバー（スマホなどで見やすくするため） */
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        /* スクロールを滑らかに */
        .scroll-smooth {
            scroll-behavior: smooth;
        }
        /* タップ時のハイライトを消す */
        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-sky-50 text-gray-800 font-sans antialiased overflow-x-hidden">

    <!-- Reactアプリのマウントポイント -->
    <div id="root"></div>

    <!-- アプリケーションのコード -->
    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        // --- アイコンのSVG定義 (Lucideの代用) ---
        const IconVolume2 = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        );
        const IconDelete = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
        );
        const IconTrash2 = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        );
        const IconInfo = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        );

        const KEYMAP = {
            seion: [
                ['わ', 'を', 'ん', 'ー', '。'], // 左端
                ['ら', 'り', 'る', 'れ', 'ろ'],
                ['や', ' ', 'ゆ', ' ', 'よ'],
                ['ま', 'み', 'む', 'め', 'も'],
                ['は', 'ひ', 'ふ', 'へ', 'ほ'],
                ['な', 'に', 'ぬ', 'ね', 'の'],
                ['た', 'ち', 'つ', 'て', 'と'],
                ['さ', 'し', 'す', 'せ', 'そ'],
                ['か', 'き', 'く', 'け', 'こ'],
                ['あ', 'い', 'う', 'え', 'お']  // 右端（初期表示位置）
            ],
            dakuon: [
                ['ぱ', 'ぴ', 'ぷ', 'ぺ', 'ぽ'],
                ['ば', 'び', 'ぶ', 'べ', 'ぼ'],
                ['だ', 'ぢ', 'づ', 'で', 'ど'],
                ['ざ', 'じ', 'ず', 'ぜ', 'ぞ'],
                ['が', 'ぎ', 'ぐ', 'げ', 'ご']
            ],
            komoji: [
                ['っ', ' ', ' ', ' ', ' '],
                ['ゃ', ' ', 'ゅ', ' ', 'ょ'],
                ['ぁ', 'ぃ', 'ぅ', 'ぇ', 'ぉ']
            ]
        };

        function App() {
            const [text, setText] = useState('');
            const [activeTab, setActiveTab] = useState('seion');
            const [isKatakana, setIsKatakana] = useState(false);
            const [isSpeechSupported, setIsSpeechSupported] = useState(true);
            const scrollRef = useRef(null);

            // 音声合成のサポート確認
            useEffect(() => {
                if (!('speechSynthesis' in window)) {
                    setIsSpeechSupported(false);
                }
            }, []);

            // タブ切り替え時、確実に右端へスクロールさせる処理
            useEffect(() => {
                const scrollToRight = () => {
                    if (scrollRef.current) {
                        scrollRef.current.scrollLeft = scrollRef.current.scrollWidth;
                    }
                };
                const timer = setTimeout(scrollToRight, 50);
                return () => clearTimeout(timer);
            }, [activeTab, isKatakana]);

            const speak = useCallback((str) => {
                if ('speechSynthesis' in window && str) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(str);
                    utterance.lang = 'ja-JP';
                    utterance.rate = 0.85; 
                    utterance.pitch = 1.2; 
                    window.speechSynthesis.speak(utterance);
                }
            }, []);

            const toDisplayChar = useCallback((char) => {
                if (!isKatakana || !char || char.trim() === '') return char;
                const excludes = ['ー', '。', '、', '！', '？', ' '];
                if (excludes.includes(char)) return char;
                return char.replace(/[\u3041-\u3096]/g, match => String.fromCharCode(match.charCodeAt(0) + 0x60));
            }, [isKatakana]);

            const handleCharClick = (char) => {
                if (!char || char.trim() === '') return;
                setText((prev) => prev + char);
                speak(char);
            };

            const handlePlayAll = () => {
                if (text) speak(text);
            };

            const handleDeleteLast = () => {
                setText((prev) => prev.slice(0, -1));
            };

            const handleClearAll = () => {
                setText('');
                window.speechSynthesis.cancel();
            };

            const TabButton = ({ isActive, onClick, children }) => (
                <button
                    onClick={onClick}
                    className={`flex-1 py-3 px-1 text-sm md:text-xl font-bold rounded-t-xl transition-all whitespace-nowrap ${
                        isActive
                            ? 'bg-blue-100 text-blue-800 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] border-t-4 border-blue-500'
                            : 'bg-white text-gray-500 hover:bg-gray-50 border-t-4 border-transparent'
                    }`}
                >
                    {children}
                </button>
            );

            const KeyButton = ({ char, onClick }) => {
                const isBlank = !char || char.trim() === '';
                if (isBlank) {
                    return <div className="h-14 md:h-20 rounded-xl"></div>;
                }
                return (
                    <button
                        onClick={onClick}
                        className="h-14 md:h-20 bg-white border-2 border-gray-100 rounded-xl shadow-[0_4px_0_0_#cbd5e1] active:shadow-none active:translate-y-1 active:border-gray-300 flex items-center justify-center text-2xl md:text-4xl font-bold text-gray-800 touch-manipulation select-none transition-all"
                    >
                        {char}
                    </button>
                );
            };

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    <div className="max-w-4xl mx-auto w-full flex-1 flex flex-col p-2 md:p-4">
                        
                        {!isSpeechSupported && (
                            <div className="bg-red-100 text-red-700 p-3 rounded-xl mb-4 flex items-center gap-2 font-bold">
                                <IconInfo />
                                お使いのブラウザは音声再生に対応していません。
                            </div>
                        )}

                        {/* 上部：ディスプレイとコントロール */}
                        <div className="bg-white rounded-2xl shadow-sm p-3 md:p-4 mb-4 flex flex-col gap-3 md:gap-4">
                            
                            {/* テキスト表示エリア */}
                            <div className="min-h-[4.5rem] md:min-h-[5rem] bg-gray-50 rounded-xl p-3 md:p-4 text-2xl md:text-5xl font-bold text-gray-800 break-all border-2 border-gray-200 flex items-center">
                                {text || <span className="text-gray-300">ここにもじがでるよ</span>}
                            </div>
                            
                            {/* アクションボタン群 */}
                            <div className="flex gap-2 h-14 md:h-20">
                                <button
                                    onClick={handlePlayAll}
                                    disabled={!text}
                                    className={`flex-1 rounded-xl flex items-center justify-center gap-2 text-lg md:text-3xl font-bold transition-all shadow-[0_4px_0_0_rgba(0,0,0,0.1)] active:shadow-none active:translate-y-1 ${
                                        text ? 'bg-green-500 text-white shadow-green-700' : 'bg-gray-200 text-gray-400 cursor-not-allowed shadow-gray-300'
                                    }`}
                                >
                                    <IconVolume2 />
                                    ぜんぶよむ
                                </button>
                                <button
                                    onClick={handleDeleteLast}
                                    disabled={!text}
                                    className={`w-16 md:w-32 rounded-xl flex flex-col items-center justify-center gap-1 transition-all shadow-[0_4px_0_0_rgba(0,0,0,0.1)] active:shadow-none active:translate-y-1 ${
                                        text ? 'bg-yellow-500 text-white shadow-yellow-700' : 'bg-gray-200 text-gray-400 cursor-not-allowed shadow-gray-300'
                                    }`}
                                >
                                    <IconDelete />
                                    <span className="text-[10px] md:text-base font-bold">けす</span>
                                </button>
                                <button
                                    onClick={handleClearAll}
                                    disabled={!text}
                                    className={`w-16 md:w-32 rounded-xl flex flex-col items-center justify-center gap-1 transition-all shadow-[0_4px_0_0_rgba(0,0,0,0.1)] active:shadow-none active:translate-y-1 ${
                                        text ? 'bg-red-500 text-white shadow-red-700' : 'bg-gray-200 text-gray-400 cursor-not-allowed shadow-gray-300'
                                    }`}
                                >
                                    <IconTrash2 />
                                    <span className="text-[10px] md:text-base font-bold">ぜんぶけす</span>
                                </button>
                            </div>
                        </div>

                        {/* ひらがな・カタカナ 切り替えトグル */}
                        <div className="flex justify-center md:justify-start mb-2 px-2">
                            <div className="bg-gray-200 p-1 rounded-xl flex gap-1 shadow-inner w-full md:w-auto">
                                <button
                                    onClick={() => setIsKatakana(false)}
                                    className={`flex-1 md:flex-none px-4 py-2 md:px-8 md:py-3 rounded-lg font-bold text-base md:text-xl transition-all ${
                                        !isKatakana ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:bg-gray-300'
                                    }`}
                                >
                                    ひらがな
                                </button>
                                <button
                                    onClick={() => setIsKatakana(true)}
                                    className={`flex-1 md:flex-none px-4 py-2 md:px-8 md:py-3 rounded-lg font-bold text-base md:text-xl transition-all ${
                                        isKatakana ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:bg-gray-300'
                                    }`}
                                >
                                    カタカナ
                                </button>
                            </div>
                        </div>

                        {/* タブ切り替え */}
                        <div className="flex px-2 gap-1 mt-2">
                            <TabButton isActive={activeTab === 'seion'} onClick={() => setActiveTab('seion')}>
                                {isKatakana ? 'アカサタナ' : 'あかさたな'}
                            </TabButton>
                            <TabButton isActive={activeTab === 'dakuon'} onClick={() => setActiveTab('dakuon')}>
                                {isKatakana ? 'ガザダバパ' : 'がざだばぱ'}
                            </TabButton>
                            <TabButton isActive={activeTab === 'komoji'} onClick={() => setActiveTab('komoji')}>
                                {isKatakana ? 'ァィゥ・ッ' : 'ぁぃぅ・っ'}
                            </TabButton>
                        </div>

                        {/* キーボードエリア */}
                        <div 
                            ref={scrollRef}
                            className="bg-blue-100 p-3 md:p-6 rounded-2xl md:rounded-b-3xl md:rounded-t-none md:rounded-tr-3xl shadow-inner overflow-x-auto custom-scrollbar scroll-smooth flex-1"
                        >
                            <div className="flex gap-2 md:gap-4 min-w-max pb-2 px-1">
                                {KEYMAP[activeTab].map((col, colIndex) => (
                                    <div 
                                        key={colIndex} 
                                        className={`flex flex-col gap-2 md:gap-4 w-[3.5rem] md:w-[5.5rem] shrink-0 ${colIndex === 0 ? 'ml-auto' : ''}`}
                                    >
                                        {col.map((char, rowIndex) => (
                                            <KeyButton
                                                key={`${colIndex}-${rowIndex}`}
                                                char={toDisplayChar(char)}
                                                onClick={() => handleCharClick(toDisplayChar(char))}
                                            />
                                        ))}
                                    </div>
                                ))}
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        // アプリケーションのマウント
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
