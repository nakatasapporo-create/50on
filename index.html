<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>おしゃべり５０音ボード</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Chromebook向けにスクロールバーを少し太くし、つかみやすくする */
        .custom-scrollbar::-webkit-scrollbar {
            height: 12px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #64748b;
            border-radius: 6px;
            border: 2px solid #e2e8f0; /* 少し余白を持たせる */
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        /* スクロールを滑らかに */
        .scroll-smooth {
            scroll-behavior: smooth;
        }
        /* タップ時のハイライトを消す */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        /* 画面全体のスクロールを無効化し、アプリ内で完結させる */
        body {
            overscroll-behavior-y: none;
            overflow: hidden; 
        }
    </style>
</head>
<body class="bg-sky-50 text-gray-800 font-sans antialiased h-[100dvh]">

    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        // --- アイコンのSVG定義 ---
        const IconVolume2 = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        );
        const IconDelete = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
        );
        const IconTrash2 = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        );
        const IconInfo = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        );
        const IconMaximize = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
        );
        const IconMinimize = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"></path><path d="M21 8h-3a2 2 0 0 1-2-2V3"></path><path d="M3 16h3a2 2 0 0 1 2 2v3"></path><path d="M16 21v-3a2 2 0 0 1 2-2h3"></path></svg>
        );

        const KEYMAP = {
            seion: [
                ['わ', 'を', 'ん', 'ー', '。'], // 左端
                ['ら', 'り', 'る', 'れ', 'ろ'],
                ['や', ' ', 'ゆ', ' ', 'よ'],
                ['ま', 'み', 'む', 'め', 'も'],
                ['は', 'ひ', 'ふ', 'へ', 'ほ'],
                ['な', 'に', 'ぬ', 'ね', 'の'],
                ['た', 'ち', 'つ', 'て', 'と'],
                ['さ', 'し', 'す', 'せ', 'そ'],
                ['か', 'き', 'く', 'け', 'こ'],
                ['あ', 'い', 'う', 'え', 'お']  // 右端（初期表示位置）
            ],
            dakuon: [
                ['ぱ', 'ぴ', 'ぷ', 'ぺ', 'ぽ'],
                ['ば', 'び', 'ぶ', 'べ', 'ぼ'],
                ['だ', 'ぢ', 'づ', 'で', 'ど'],
                ['ざ', 'じ', 'ず', 'ぜ', 'ぞ'],
                ['が', 'ぎ', 'ぐ', 'げ', 'ご']
            ],
            komoji: [
                ['っ', ' ', ' ', ' ', ' '],
                ['ゃ', ' ', 'ゅ', ' ', 'ょ'],
                ['ぁ', 'ぃ', 'ぅ', 'ぇ', 'ぉ']
            ]
        };

        function App() {
            const [text, setText] = useState('');
            const [activeTab, setActiveTab] = useState('seion');
            const [isKatakana, setIsKatakana] = useState(false);
            const [isSpeechSupported, setIsSpeechSupported] = useState(true);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const scrollRef = useRef(null);

            useEffect(() => {
                if (!('speechSynthesis' in window)) {
                    setIsSpeechSupported(false);
                }

                // フルスクリーン状態の変更を監視
                const handleFullscreenChange = () => {
                    setIsFullscreen(!!document.fullscreenElement);
                };
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
            }, []);

            // スクロール位置を右端（あ行）に合わせる
            useEffect(() => {
                const scrollToRight = () => {
                    if (scrollRef.current) {
                        scrollRef.current.scrollLeft = scrollRef.current.scrollWidth;
                    }
                };
                const timer = setTimeout(scrollToRight, 50);
                return () => clearTimeout(timer);
            }, [activeTab, isKatakana]);

            const toggleFullScreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.warn("フルスクリーンにできませんでした:", err);
                    });
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            };

            const speak = useCallback((str) => {
                if ('speechSynthesis' in window && str) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(str);
                    utterance.lang = 'ja-JP';
                    utterance.rate = 0.85; 
                    utterance.pitch = 1.2; 
                    window.speechSynthesis.speak(utterance);
                }
            }, []);

            const toDisplayChar = useCallback((char) => {
                if (!isKatakana || !char || char.trim() === '') return char;
                const excludes = ['ー', '。', '、', '！', '？', ' '];
                if (excludes.includes(char)) return char;
                return char.replace(/[\u3041-\u3096]/g, match => String.fromCharCode(match.charCodeAt(0) + 0x60));
            }, [isKatakana]);

            const handleCharClick = (char) => {
                if (!char || char.trim() === '') return;
                setText((prev) => prev + char);
                speak(char);
            };

            const handlePlayAll = () => {
                if (text) speak(text);
            };

            const handleDeleteLast = () => {
                setText((prev) => prev.slice(0, -1));
            };

            const handleClearAll = () => {
                setText('');
                window.speechSynthesis.cancel();
            };

            const TabButton = ({ isActive, onClick, children }) => (
                <button
                    onClick={onClick}
                    className={`flex-1 py-2 lg:py-3 px-1 text-sm lg:text-xl font-bold rounded-t-xl transition-all whitespace-nowrap ${
                        isActive
                            ? 'bg-blue-100 text-blue-800 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] border-t-4 border-blue-500'
                            : 'bg-white text-gray-500 hover:bg-gray-50 border-t-4 border-transparent'
                    }`}
                >
                    {children}
                </button>
            );

            const KeyButton = ({ char, onClick }) => {
                const isBlank = !char || char.trim() === '';
                if (isBlank) {
                    // 空白セル。フレックスコンテナ内で等分に広がるようにする
                    return <div className="flex-1 rounded-xl"></div>;
                }
                return (
                    <button
                        onClick={onClick}
                        // 高さをflex-1にすることで、Chromebookの画面サイズに合わせて自動伸縮します
                        className="flex-1 min-h-[3.5rem] bg-white border-2 border-gray-100 rounded-xl shadow-[0_4px_0_0_#cbd5e1] active:shadow-none active:translate-y-1 active:border-gray-300 flex items-center justify-center text-3xl lg:text-4xl font-bold text-gray-800 touch-manipulation select-none transition-all"
                    >
                        {char}
                    </button>
                );
            };

            return (
                // h-full と flex flex-col で画面の縦幅にピタッと合わせる
                <div className="h-full flex flex-col font-sans overflow-hidden">
                    <div className="max-w-5xl mx-auto w-full h-full flex flex-col p-2 lg:p-4 gap-2">
                        
                        {/* ヘッダーエリア（フルスクリーンボタン付き） */}
                        <div className="flex justify-between items-center px-1">
                            {!isSpeechSupported ? (
                                <div className="bg-red-100 text-red-700 p-2 rounded-lg flex items-center gap-2 font-bold text-sm">
                                    <IconInfo /> 音声非対応
                                </div>
                            ) : (
                                <div className="text-blue-800 font-bold text-lg hidden sm:block">おしゃべり５０音ボード</div>
                            )}

                            {/* ひらがな・カタカナ 切り替えトグル */}
                            <div className="bg-white/50 p-1 rounded-xl flex gap-1 shadow-sm">
                                <button
                                    onClick={() => setIsKatakana(false)}
                                    className={`px-4 py-1.5 lg:px-6 lg:py-2 rounded-lg font-bold text-sm lg:text-lg transition-all ${
                                        !isKatakana ? 'bg-white text-blue-600 shadow' : 'text-gray-500 hover:bg-white/50'
                                    }`}
                                >
                                    ひらがな
                                </button>
                                <button
                                    onClick={() => setIsKatakana(true)}
                                    className={`px-4 py-1.5 lg:px-6 lg:py-2 rounded-lg font-bold text-sm lg:text-lg transition-all ${
                                        isKatakana ? 'bg-white text-blue-600 shadow' : 'text-gray-500 hover:bg-white/50'
                                    }`}
                                >
                                    カタカナ
                                </button>
                            </div>

                            <button
                                onClick={toggleFullScreen}
                                className="bg-white p-2 rounded-lg shadow-sm text-gray-600 hover:text-blue-600 hover:bg-blue-50 transition-colors flex items-center gap-1 font-bold text-sm"
                                title="全画面表示の切り替え"
                            >
                                {isFullscreen ? <IconMinimize /> : <IconMaximize />}
                                <span className="hidden sm:inline">{isFullscreen ? 'もとにもどす' : 'おおきくする'}</span>
                            </button>
                        </div>

                        {/* ディスプレイとコントロール */}
                        <div className="bg-white rounded-2xl shadow-sm p-2 lg:p-4 shrink-0 flex flex-col gap-2 lg:gap-4">
                            
                            {/* テキスト表示エリア */}
                            <div className="min-h-[4rem] lg:min-h-[5rem] bg-gray-50 rounded-xl p-2 lg:p-4 text-3xl lg:text-5xl font-bold text-gray-800 break-all border-2 border-gray-200 flex items-center">
                                {text || <span className="text-gray-300">ここにもじがでるよ</span>}
                            </div>
                            
                            {/* アクションボタン群 */}
                            <div className="flex gap-2 h-14 lg:h-16">
                                <button
                                    onClick={handlePlayAll}
                                    disabled={!text}
                                    className={`flex-1 rounded-xl flex items-center justify-center gap-2 text-xl lg:text-2xl font-bold transition-all shadow-[0_4px_0_0_rgba(0,0,0,0.1)] active:shadow-none active:translate-y-1 ${
                                        text ? 'bg-green-500 text-white shadow-green-700' : 'bg-gray-200 text-gray-400 cursor-not-allowed shadow-gray-300'
                                    }`}
                                >
                                    <IconVolume2 />
                                    ぜんぶよむ
                                </button>
                                <button
                                    onClick={handleDeleteLast}
                                    disabled={!text}
                                    className={`w-20 lg:w-32 rounded-xl flex flex-col items-center justify-center gap-0.5 transition-all shadow-[0_4px_0_0_rgba(0,0,0,0.1)] active:shadow-none active:translate-y-1 ${
                                        text ? 'bg-yellow-500 text-white shadow-yellow-700' : 'bg-gray-200 text-gray-400 cursor-not-allowed shadow-gray-300'
                                    }`}
                                >
                                    <IconDelete />
                                    <span className="text-[11px] lg:text-sm font-bold">けす</span>
                                </button>
                                <button
                                    onClick={handleClearAll}
                                    disabled={!text}
                                    className={`w-20 lg:w-32 rounded-xl flex flex-col items-center justify-center gap-0.5 transition-all shadow-[0_4px_0_0_rgba(0,0,0,0.1)] active:shadow-none active:translate-y-1 ${
                                        text ? 'bg-red-500 text-white shadow-red-700' : 'bg-gray-200 text-gray-400 cursor-not-allowed shadow-gray-300'
                                    }`}
                                >
                                    <IconTrash2 />
                                    <span className="text-[11px] lg:text-sm font-bold">ぜんぶけす</span>
                                </button>
                            </div>
                        </div>

                        {/* タブとキーボードエリア (残り高さをすべて使う) */}
                        <div className="flex flex-col min-h-0 flex-1">
                            <div className="flex px-2 gap-1 shrink-0">
                                <TabButton isActive={activeTab === 'seion'} onClick={() => setActiveTab('seion')}>
                                    {isKatakana ? 'アカサタナ' : 'あかさたな'}
                                </TabButton>
                                <TabButton isActive={activeTab === 'dakuon'} onClick={() => setActiveTab('dakuon')}>
                                    {isKatakana ? 'ガザダバパ' : 'がざだばぱ'}
                                </TabButton>
                                <TabButton isActive={activeTab === 'komoji'} onClick={() => setActiveTab('komoji')}>
                                    {isKatakana ? 'ァィゥ・ッ' : 'ぁぃぅ・っ'}
                                </TabButton>
                            </div>

                            {/* キーボード本体 */}
                            <div 
                                ref={scrollRef}
                                className="bg-blue-100 p-2 lg:p-4 rounded-2xl lg:rounded-b-3xl rounded-t-none lg:rounded-tr-3xl shadow-inner overflow-x-auto custom-scrollbar scroll-smooth flex-1 flex flex-col"
                            >
                                {/* ml-auto で「あ行」を右寄せ。h-fullで高さをいっぱいに */}
                                <div className="flex gap-2 lg:gap-4 min-w-max pb-3 px-1 h-full items-stretch">
                                    {KEYMAP[activeTab].map((col, colIndex) => (
                                        <div 
                                            key={colIndex} 
                                            className={`flex flex-col gap-2 lg:gap-3 w-[4.5rem] lg:w-[6rem] shrink-0 ${colIndex === 0 ? 'ml-auto' : ''}`}
                                        >
                                            {col.map((char, rowIndex) => (
                                                <KeyButton
                                                    key={`${colIndex}-${rowIndex}`}
                                                    char={toDisplayChar(char)}
                                                    onClick={() => handleCharClick(toDisplayChar(char))}
                                                />
                                            ))}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        // アプリケーションのマウント
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
