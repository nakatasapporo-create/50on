<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>おしゃべり５０音ボード</title>
    
    <!-- Import Map で React と Firebase を読み込みます -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18",
            "react-dom/client": "https://esm.sh/react-dom@18/client",
            "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
            "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
        }
    }
    </script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* スクロールバーのカスタマイズ */
        .custom-scrollbar::-webkit-scrollbar { height: 10px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 5px; }
        * { -webkit-tap-highlight-color: transparent; }
        /* 画面スクロール無効化 */
        body { overscroll-behavior-y: none; overflow: hidden; }
    </style>
</head>
<body class="bg-sky-50 text-gray-800 font-sans antialiased h-[100dvh]">

    <div id="root" class="h-full"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        
        // Firebase のインポート
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from 'firebase/firestore';

        // --- Firebase 初期化 (環境変数がある場合のみ) ---
        const isFirebase = typeof window.__firebase_config !== 'undefined';
        let app, auth, db, appId;
        if (isFirebase) {
            app = initializeApp(JSON.parse(window.__firebase_config));
            auth = getAuth(app);
            db = getFirestore(app);
            appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'default-app-id';
        }

        // --- アイコン ---
        const IconVolume2 = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>;
        const IconDelete = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>;
        const IconTrash2 = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
        const IconInfo = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;
        const IconMaximize = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>;
        const IconMinimize = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"></path><path d="M21 8h-3a2 2 0 0 1-2-2V3"></path><path d="M3 16h3a2 2 0 0 1 2 2v3"></path><path d="M16 21v-3a2 2 0 0 1 2-2h3"></path></svg>;
        const IconSave = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
        const IconX = ({ size = 16 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;

        const KEYMAP = {
            seion: [
                ['わ', 'を', 'ん', 'ー', '。'],
                ['ら', 'り', 'る', 'れ', 'ろ'],
                ['や', ' ', 'ゆ', ' ', 'よ'],
                ['ま', 'み', 'む', 'め', 'も'],
                ['は', 'ひ', 'ふ', 'へ', 'ほ'],
                ['な', 'に', 'ぬ', 'ね', 'の'],
                ['た', 'ち', 'つ', 'て', 'と'],
                ['さ', 'し', 'す', 'せ', 'そ'],
                ['か', 'き', 'く', 'け', 'こ'],
                ['あ', 'い', 'う', 'え', 'お']
            ],
            dakuon: [
                ['ぱ', 'ぴ', 'ぷ', 'ぺ', 'ぽ'],
                ['ば', 'び', 'ぶ', 'べ', 'ぼ'],
                ['だ', 'ぢ', 'づ', 'で', 'ど'],
                ['ざ', 'じ', 'ず', 'ぜ', 'ぞ'],
                ['が', 'ぎ', 'ぐ', 'げ', 'ご']
            ],
            komoji: [
                ['っ', ' ', ' ', ' ', ' '],
                ['ゃ', ' ', 'ゅ', ' ', 'ょ'],
                ['ぁ', 'ぃ', 'ぅ', 'ぇ', 'ぉ']
            ]
        };

        function App() {
            const [text, setText] = useState('');
            const [activeTab, setActiveTab] = useState('seion');
            const [isKatakana, setIsKatakana] = useState(false);
            const [isSpeechSupported, setIsSpeechSupported] = useState(true);
            const [isFullscreen, setIsFullscreen] = useState(false);
            
            // ユーザーと保存データ
            const [user, setUser] = useState(null);
            const [savedPhrases, setSavedPhrases] = useState([]);

            // 音声対応チェックとフルスクリーン監視
            useEffect(() => {
                if (!('speechSynthesis' in window)) setIsSpeechSupported(false);
                const handleFullscreenChange = () => setIsFullscreen(!!document.fullscreenElement);
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
            }, []);

            // Firebase: 認証
            useEffect(() => {
                if (!isFirebase) return;
                const initAuth = async () => {
                    try {
                        if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                            await signInWithCustomToken(auth, window.__initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.error("Auth error", e);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // Firebase: 保存された言葉の読み込み
            useEffect(() => {
                if (!isFirebase || !user) return;
                const colRef = collection(db, 'artifacts', appId, 'users', user.uid, 'phrases');
                const unsubscribe = onSnapshot(colRef, (snapshot) => {
                    const phrases = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    phrases.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                    setSavedPhrases(phrases);
                }, (error) => {
                    console.error("Firestore error:", error);
                });
                return () => unsubscribe();
            }, [user]);

            const toggleFullScreen = () => {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e => console.warn(e));
                else if (document.exitFullscreen) document.exitFullscreen();
            };

            const speak = useCallback((str) => {
                if ('speechSynthesis' in window && str) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(str);
                    utterance.lang = 'ja-JP';
                    utterance.rate = 0.85; 
                    utterance.pitch = 1.2; 
                    window.speechSynthesis.speak(utterance);
                }
            }, []);

            const toDisplayChar = useCallback((char) => {
                if (!isKatakana || !char || char.trim() === '') return char;
                const excludes = ['ー', '。', '、', '！', '？', ' '];
                if (excludes.includes(char)) return char;
                return char.replace(/[\u3041-\u3096]/g, match => String.fromCharCode(match.charCodeAt(0) + 0x60));
            }, [isKatakana]);

            const handleCharClick = (char) => {
                if (!char || char.trim() === '') return;
                setText((prev) => prev + char);
                speak(char);
            };

            const handlePlayAll = () => { if (text) speak(text); };
            const handleDeleteLast = () => setText((prev) => prev.slice(0, -1));
            const handleClearAll = () => { setText(''); window.speechSynthesis.cancel(); };

            // 言葉の保存
            const handleSave = async () => {
                if (!text) return;
                if (isFirebase && user) {
                    const colRef = collection(db, 'artifacts', appId, 'users', user.uid, 'phrases');
                    await addDoc(colRef, { text, createdAt: Date.now() });
                } else {
                    // Firebaseがない（オフライン）環境用の一時保存
                    setSavedPhrases(prev => [...prev, { id: Date.now().toString(), text }]);
                }
            };

            // 言葉の読み出し
            const handleLoad = (savedText) => {
                setText(savedText);
                speak(savedText); // 読み出すと同時に喋る
            };

            // 保存した言葉の削除
            const handleDeleteSaved = async (id) => {
                if (isFirebase && user) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'phrases', id));
                } else {
                    setSavedPhrases(prev => prev.filter(p => p.id !== id));
                }
            };

            const TabButton = ({ isActive, onClick, children }) => (
                <button
                    onClick={onClick}
                    className={`flex-1 py-1 lg:py-2 px-1 text-[11px] sm:text-sm lg:text-xl font-bold rounded-t-xl transition-all whitespace-nowrap ${
                        isActive
                            ? 'bg-blue-100 text-blue-800 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] border-t-4 border-blue-500'
                            : 'bg-white text-gray-500 hover:bg-gray-50 border-t-4 border-transparent'
                    }`}
                >
                    {children}
                </button>
            );

            const KeyButton = ({ char, onClick }) => {
                if (!char || char.trim() === '') return <div className="flex-1 min-h-[1.5rem]"></div>;
                return (
                    <button
                        onClick={onClick}
                        // flex-1 を付けることで、縦方向の余白を等分して広げます
                        className="flex-1 w-full min-h-[2.5rem] bg-white border-2 border-gray-100 rounded-xl shadow-[0_4px_0_0_#cbd5e1] active:shadow-none active:translate-y-1 active:border-gray-300 flex items-center justify-center text-2xl sm:text-3xl lg:text-4xl font-bold text-gray-800 touch-manipulation select-none transition-all"
                    >
                        {char}
                    </button>
                );
            };

            return (
                <div className="h-full flex flex-col font-sans overflow-hidden bg-sky-50">
                    <div className="max-w-6xl mx-auto w-full h-full flex flex-col p-1 sm:p-2 lg:p-4 gap-1 sm:gap-2">
                        
                        {/* ヘッダーエリア */}
                        <div className="flex justify-between items-center px-1 shrink-0">
                            {!isSpeechSupported ? (
                                <div className="bg-red-100 text-red-700 px-2 py-1 rounded-lg flex items-center gap-1 font-bold text-xs">
                                    <IconInfo /> 音声非対応
                                </div>
                            ) : (
                                <div className="text-blue-800 font-bold text-sm lg:text-lg hidden sm:block">おしゃべり５０音ボード</div>
                            )}

                            <div className="bg-white/60 p-1 rounded-xl flex gap-1 shadow-sm">
                                <button
                                    onClick={() => setIsKatakana(false)}
                                    className={`px-3 py-1 lg:px-6 lg:py-1.5 rounded-lg font-bold text-xs lg:text-base transition-all ${
                                        !isKatakana ? 'bg-white text-blue-600 shadow' : 'text-gray-500 hover:bg-white/50'
                                    }`}
                                >
                                    ひらがな
                                </button>
                                <button
                                    onClick={() => setIsKatakana(true)}
                                    className={`px-3 py-1 lg:px-6 lg:py-1.5 rounded-lg font-bold text-xs lg:text-base transition-all ${
                                        isKatakana ? 'bg-white text-blue-600 shadow' : 'text-gray-500 hover:bg-white/50'
                                    }`}
                                >
                                    カタカナ
                                </button>
                            </div>

                            <button
                                onClick={toggleFullScreen}
                                className="bg-white p-1.5 lg:p-2 rounded-lg shadow-sm text-gray-600 hover:text-blue-600 transition-colors flex items-center gap-1 font-bold text-xs lg:text-sm"
                            >
                                {isFullscreen ? <IconMinimize /> : <IconMaximize />}
                                <span className="hidden sm:inline">{isFullscreen ? 'もとにもどす' : 'おおきくする'}</span>
                            </button>
                        </div>

                        {/* ディスプレイとコントロール */}
                        <div className="bg-white rounded-xl lg:rounded-2xl shadow-sm p-2 lg:p-3 shrink-0 flex flex-col gap-2">
                            
                            {/* テキスト表示 */}
                            <div className="min-h-[3.5rem] lg:min-h-[4.5rem] bg-gray-50 rounded-xl p-2 lg:p-3 text-2xl lg:text-4xl font-bold text-gray-800 break-all border-2 border-gray-200 flex items-center">
                                {text || <span className="text-gray-300">ここにもじがでるよ</span>}
                            </div>
                            
                            {/* アクションボタン */}
                            <div className="flex gap-1.5 lg:gap-2 h-10 lg:h-14">
                                <button
                                    onClick={handlePlayAll}
                                    disabled={!text}
                                    className={`flex-1 rounded-xl flex items-center justify-center gap-1 text-sm lg:text-xl font-bold transition-all shadow-[0_3px_0_0_rgba(0,0,0,0.1)] active:shadow-none active:translate-y-1 ${
                                        text ? 'bg-green-500 text-white shadow-green-700' : 'bg-gray-200 text-gray-400 cursor-not-allowed shadow-gray-300'
                                    }`}
                                >
                                    <IconVolume2 /> <span className="hidden sm:inline">ぜんぶ</span>よむ
                                </button>
                                <button
                                    onClick={handleSave}
                                    disabled={!text}
                                    className={`w-16 sm:w-20 lg:w-28 rounded-xl flex flex-col items-center justify-center gap-0.5 transition-all shadow-[0_3px_0_0_rgba(0,0,0,0.1)] active:shadow-none active:translate-y-1 ${
                                        text ? 'bg-blue-500 text-white shadow-blue-700' : 'bg-gray-200 text-gray-400 cursor-not-allowed shadow-gray-300'
                                    }`}
                                >
                                    <IconSave />
                                    <span className="text-[10px] lg:text-xs font-bold">ほぞん</span>
                                </button>
                                <button
                                    onClick={handleDeleteLast}
                                    disabled={!text}
                                    className={`w-14 sm:w-16 lg:w-24 rounded-xl flex flex-col items-center justify-center gap-0.5 transition-all shadow-[0_3px_0_0_rgba(0,0,0,0.1)] active:shadow-none active:translate-y-1 ${
                                        text ? 'bg-yellow-500 text-white shadow-yellow-700' : 'bg-gray-200 text-gray-400 cursor-not-allowed shadow-gray-300'
                                    }`}
                                >
                                    <IconDelete />
                                    <span className="text-[10px] lg:text-xs font-bold">けす</span>
                                </button>
                                <button
                                    onClick={handleClearAll}
                                    disabled={!text}
                                    className={`w-14 sm:w-16 lg:w-24 rounded-xl flex flex-col items-center justify-center gap-0.5 transition-all shadow-[0_3px_0_0_rgba(0,0,0,0.1)] active:shadow-none active:translate-y-1 ${
                                        text ? 'bg-red-500 text-white shadow-red-700' : 'bg-gray-200 text-gray-400 cursor-not-allowed shadow-gray-300'
                                    }`}
                                >
                                    <IconTrash2 />
                                    <span className="text-[10px] lg:text-xs font-bold">ぜんぶ</span>
                                </button>
                            </div>

                            {/* 保存したことばリスト（横スクロール） */}
                            <div className="h-12 lg:h-14 bg-gray-50 border border-gray-200 rounded-lg p-1.5 flex gap-2 items-center overflow-x-auto custom-scrollbar">
                                <span className="text-gray-400 text-xs lg:text-sm font-bold shrink-0 ml-1">ほぞんしたことば:</span>
                                {savedPhrases.length === 0 && (
                                    <span className="text-gray-400 text-xs lg:text-sm">まだありません</span>
                                )}
                                {savedPhrases.map(p => (
                                    <div key={p.id} className="flex bg-white border border-gray-300 rounded-lg shadow-sm shrink-0 items-center overflow-hidden">
                                        <button 
                                            onClick={() => handleLoad(p.text)} 
                                            className="px-3 py-1 lg:py-1.5 text-sm lg:text-base font-bold text-gray-700 hover:bg-blue-50 transition-colors"
                                        >
                                            {p.text}
                                        </button>
                                        <div className="w-px h-4 bg-gray-200"></div>
                                        <button 
                                            onClick={() => handleDeleteSaved(p.id)} 
                                            className="px-2 py-1 lg:py-1.5 text-red-500 hover:bg-red-50 transition-colors"
                                            title="削除する"
                                        >
                                            <IconX size={16} />
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* タブとキーボードエリア */}
                        <div className="flex flex-col min-h-0 flex-1">
                            <div className="flex px-1 sm:px-2 gap-1 shrink-0">
                                <TabButton isActive={activeTab === 'seion'} onClick={() => setActiveTab('seion')}>
                                    {isKatakana ? 'アカサタナ' : 'あかさたな'}
                                </TabButton>
                                <TabButton isActive={activeTab === 'dakuon'} onClick={() => setActiveTab('dakuon')}>
                                    {isKatakana ? 'ガザダバパ' : 'がざだばぱ'}
                                </TabButton>
                                <TabButton isActive={activeTab === 'komoji'} onClick={() => setActiveTab('komoji')}>
                                    {isKatakana ? 'ァィゥ・ッ' : 'ぁぃぅ・っ'}
                                </TabButton>
                            </div>

                            {/* キーボード本体: flex-1で画面の残りの高さをすべて使い、内部もflexで等分する */}
                            <div className="bg-blue-100 p-1 sm:p-2 lg:p-4 rounded-xl lg:rounded-b-3xl rounded-t-none lg:rounded-tr-3xl shadow-inner flex-1 flex flex-col min-h-0">
                                <div className="flex w-full h-full gap-1 sm:gap-2">
                                    {KEYMAP[activeTab].map((col, colIndex) => (
                                        // 各列もflex-1で横幅を等分
                                        <div key={colIndex} className="flex flex-col flex-1 gap-1 sm:gap-2">
                                            {col.map((char, rowIndex) => (
                                                <KeyButton
                                                    key={`${colIndex}-${rowIndex}`}
                                                    char={toDisplayChar(char)}
                                                    onClick={() => handleCharClick(toDisplayChar(char))}
                                                />
                                            ))}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
